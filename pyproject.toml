[project]
name = "deep_research_engine"
version = "0.1.0"
description = "deep_research_engine using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]==1.14.4",
    "exa-py",
    "pydantic",
    "textual",
    "python-dotenv",
    "trafilatura",
    "spacy",
    "spacy-llm",
    "txtai[pipeline,similarity,ann]",
    "redis",
    "kreuzberg",
]

[project.scripts]
deep_research_engine = "deep_research_engine.main:run"
run_crew = "deep_research_engine.main:run"
train = "deep_research_engine.main:train"
replay = "deep_research_engine.main:replay"
test = "deep_research_engine.main:test"
run_with_trigger = "deep_research_engine.main:run_with_trigger"
configure_crew = "deep_research_engine.tui_config:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
